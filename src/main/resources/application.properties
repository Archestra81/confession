src/main/resources/application.properties
spring.application.name=anonymous-confessions

# Railway provides the PORT environment variable
server.port=${PORT:8080}
server.address=0.0.0.0

# Persistent local file database for basic testing
spring.datasource.url=jdbc:h2:file:./data/confessionsdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Disable the database console publicly
spring.h2.console.enabled=false

# Read the secret from Railway environment variables
app.admin.passcode=${ADMIN_PASSCODE}